[project]
name = "dentacall-api"
version = "0.1.0"
description = "FastAPI service for DentaCall"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dentacall-core",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "phonenumbers==8.13.55",
    "httpx==0.28.1",
]

[tool.uv.sources]
dentacall-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dentacall_api"]
