[project]
name = "dentacall-workspace"
version = "0.1.0"
description = "Production-Grade Voice Appointment Agent for Dental Clinics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dentacall-core",
]

[tool.uv.sources]
dentacall-core = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/evals",
    "apps/api",
    "apps/agent",
]

[dependency-groups]
dev = [
    "ruff==0.9.3",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pre-commit==4.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # type-checking imports
]
ignore = [
    "E501", # line too long (handled by ruff format)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "dentacall_core.tests.*",
    "dentacall_evals.tests.*",
    "dentacall_api.tests.*",
    "dentacall_agent.tests.*",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "packages.core.alembic.*",
    "packages.core.alembic.versions.*",
    "d857d0cc4734_initial_schema",
    "dentacall_core.models",
]
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "packages/core/tests",
    "packages/evals/tests",
    "apps/api/tests",
    "apps/agent/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: quick smoke tests verifying infrastructure and setup",
]
