[project]
name = "dentacall-core"
version = "0.1.0"
description = "Domain core and availability engine for DentaCall"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.38",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.4",
    "tzdata==2026.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dentacall_core"]
