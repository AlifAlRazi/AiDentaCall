[project]
name = "dentacall-evals"
version = "0.1.0"
description = "Evaluation harness and scenarios for DentaCall"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dentacall-core",
]

[tool.uv.sources]
dentacall-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dentacall_evals"]
